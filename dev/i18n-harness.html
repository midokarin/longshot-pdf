<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Longshot PDF — localization checks</title>
<link rel="stylesheet" href="../styles.css">
<style>
:root{--background-primary:#fff;--background-secondary:#f6f7f9;--background-modifier-border:#dfe3e9;--text-normal:#24354a;--text-muted:#687688;--interactive-accent:#357abd;--radius-s:6px;--font-ui-small:13px;--font-ui-smaller:12px}
*{box-sizing:border-box}body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:var(--text-normal);background:#f6f7f9}#settings{max-width:1100px;margin:24px auto;padding:24px;background:#fff;border-radius:12px}.setting-item{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-top:1px solid var(--background-modifier-border)}.setting-item-info{flex:1;min-width:0}.setting-item-name{font-size:14px;font-weight:500}.setting-item-description{font-size:12px;color:var(--text-muted);line-height:1.6}.setting-item-control{display:flex;align-items:center;gap:8px}input,select,button{font:inherit;max-width:100%;padding:5px;border:1px solid #dfe3e9;border-radius:5px;background:#fff;color:var(--text-normal)}input[type=range]{width:100px}input[type=checkbox]{width:18px;height:18px}button{cursor:pointer}.is-hidden{display:none!important}.modal-container{position:fixed;inset:0;background:#0004;display:flex;align-items:center;justify-content:center}.modal{width:min(760px,calc(100vw - 32px));max-height:92vh;overflow:auto;padding:24px;background:#fff;border-radius:12px}#log{white-space:pre-wrap;font-size:12px;margin:24px}h2:empty{display:none}
</style></head><body><main id="settings"></main><pre id="log">Running…</pre><script type="module" src="./i18n-harness.js"></script></body></html>
